
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerEquity AI | Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    background: linear-gradient(125deg,#e7faff,#d7f3f8,#c5f0f1);
}

.card {
    width: 480px;
    max-width: 100%;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,.88);
    box-shadow: 0 20px 60px rgba(0,95,110,.15);
}

h1 {
    color: #10294d;
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #58718f;
    font-size: 14px;
    margin-bottom: 25px;
}

.roles {
    display: flex;
    gap: 5px;
    padding: 5px;
    background: #edf4fa;
    border-radius: 12px;
    margin-bottom: 23px;
}

.role {
    flex: 1;
    border: none;
    padding: 12px 5px;
    border-radius: 9px;
    background: transparent;
    color: #35516f;
    font-weight: 600;
    cursor: pointer;
}

.role.active {
    background: linear-gradient(120deg,#007d86,#00aaa8);
    color: white;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    color: #263f5f;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 13px;
    border: 1px solid #d4e4f3;
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #00a5a7;
    box-shadow: 0 0 0 3px rgba(0,165,167,.1);
}

.submit {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 11px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(110deg,#16bdb7,#006a76);
    cursor: pointer;
    margin-top: 10px;
}

.message {
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: #d9f8f0;
    color: #08665d;
    font-size: 13px;
}

.footer {
    text-align: center;
    margin-top: 22px;
    color: #58718f;
    font-size: 13px;
}

.footer a {
    color: #008e98;
    font-weight: 700;
    text-decoration: none;
}

.brand {
    text-align: center;
    color: #122c4d;
    font-weight: 700;
    margin-top: 25px;
}

@media(max-width:500px) {
    .card { padding: 24px 18px; }
    h1 { font-size: 27px; }
    .role { font-size: 11px; }
}
</style>
</head>

<body>

<div class="card">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register to access your CareerEquity AI workspace.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="roles">
        <button type="button" class="role active"
                onclick="selectRole(this,'HR Manager/Admin')">
            HR Manager/Admin
        </button>

        <button type="button" class="role"
                onclick="selectRole(this,'Employee')">
            Employee
        </button>
    </div>

    <form method="POST" action="{% url 'register_page' %}">
        {% csrf_token %}

        <input type="hidden" name="role"
               id="selectedRole" value="HR Manager/Admin">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="Enter your full name" required>
        </div>

        <!-- HR FIELDS -->

        <div id="hrFields">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       id="email"
                       placeholder="Enter your work email">
            </div>

            <div class="form-group">
                <label>Organization</label>
                <input type="text" name="organization"
                       id="organization"
                       placeholder="Enter organization name">
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text" name="designation"
                       id="hrDesignation"
                       placeholder="Enter your designation">
            </div>

        </div>

        <!-- EMPLOYEE FIELDS -->

        <div id="employeeFields" style="display:none;">

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" name="employee_id"
                       id="employee_id"
                       placeholder="Enter your Employee ID"
                       disabled>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department"
                       id="department"
                       placeholder="Enter your department"
                       disabled>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text" name="designation"
                       id="employeeDesignation"
                       placeholder="Enter your designation"
                       disabled>
            </div>

        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create a password"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm your password"
                   minlength="8" required>
        </div>

        <button type="submit" class="submit">
            Create Account →
        </button>

    </form>

    <div class="footer">
        Already have an account?
        <a href="{% url 'login_page' %}">Sign In</a>
    </div>

    <div class="brand">
        ✓ CareerEquity AI
    </div>

</div>

<script>

function selectRole(button, role) {

    document.querySelectorAll('.role').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');

    document.getElementById('selectedRole').value = role;

    const hrFields = document.getElementById('hrFields');
    const employeeFields = document.getElementById('employeeFields');

    const hrInputs = hrFields.querySelectorAll('input');
    const employeeInputs = employeeFields.querySelectorAll('input');

    if (role === 'Employee') {

        hrFields.style.display = 'none';
        employeeFields.style.display = 'block';

        hrInputs.forEach(input => {
            input.required = false;
            input.disabled = true;
        });

        employeeInputs.forEach(input => {
            input.required = true;
            input.disabled = false;
        });

    } else {

        hrFields.style.display = 'block';
        employeeFields.style.display = 'none';

        hrInputs.forEach(input => {
            input.required = true;
            input.disabled = false;
        });

        employeeInputs.forEach(input => {
            input.required = false;
            input.disabled = true;
        });

    }
}

</script>

</body>
</html>
