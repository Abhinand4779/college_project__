
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareerEquity AI | Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
    background: linear-gradient(125deg,
        #e7faff, #d7f3f8, #c5f0f1, #e9faff);
    position: relative;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(135deg,#48d3d0,#008d9b);
    opacity: .6;
}

.circle.one {
    width: 180px;
    height: 180px;
    right: -50px;
    top: -50px;
}

.circle.two {
    width: 75px;
    height: 75px;
    left: 42%;
    top: 18%;
}

.dots {
    position: absolute;
    width: 180px;
    height: 180px;
    background-image: radial-gradient(#71cdd9 3px,transparent 3px);
    background-size: 25px 25px;
    opacity: .35;
}

.wave {
    position: absolute;
    bottom: -110px;
    left: -5%;
    width: 110%;
    height: 230px;
    border-radius: 50% 50% 0 0;
}

.wave.one {
    background: linear-gradient(90deg,#008b96,#28c6c2);
    transform: rotate(-5deg);
}

.wave.two {
    bottom: -155px;
    background: linear-gradient(90deg,#005b70,#00a6a7);
    transform: rotate(5deg);
}

/* REGISTRATION CARD */

.register-container {
    width: 540px;
    max-width: 100%;
    padding: 35px;
    border-radius: 26px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 20px 60px rgba(0,95,110,.15);
}

/* SECURITY */

.security {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 18px;
}

.security span {
    background: #d9f8f0;
    color: #08665d;
    padding: 9px 15px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 600;
}

/* HEADING */

h1 {
    font-size: 34px;
    color: #10294d;
    font-weight: 800;
    margin-bottom: 8px;
}

.subtitle {
    color: #58718f;
    font-size: 14px;
    margin-bottom: 25px;
}

/* ROLE SELECTOR */

.roles {
    display: flex;
    background: #edf4fa;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 25px;
    gap: 4px;
}

.role {
    flex: 1;
    padding: 13px 5px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #35516f;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.role.active {
    background: linear-gradient(120deg,#007d86,#00aaa8);
    color: white;
    box-shadow: 0 4px 12px rgba(0,130,140,.2);
}

/* INPUT FIELDS */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 17px 14px;
}

.input-group {
    min-width: 0;
}

.input-group.full {
    grid-column: 1 / -1;
}

.input-group label {
    display: block;
    color: #263f5f;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
}

.input-box {
    display: flex;
    align-items: center;
    height: 53px;
    padding: 0 12px;
    border: 1px solid #d4e4f3;
    border-radius: 12px;
    background: rgba(245,250,255,.9);
    transition: .3s;
}

.input-box:focus-within {
    border-color: #00a5a7;
    box-shadow: 0 0 0 3px rgba(0,165,167,.1);
}

.input-icon {
    font-size: 17px;
    margin-right: 10px;
}

.input-box input,
.input-box select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    color: #173451;
    min-width: 0;
}

.input-box input::placeholder {
    color: #8198b3;
}

.password-toggle {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 16px;
}

/* BUTTON */

.register-btn {
    width: 100%;
    height: 55px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(110deg,#16bdb7,#006a76);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
}

.register-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,120,130,.25);
}

/* LOGIN LINK */

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #58718f;
}

.login-link a {
    color: #008e98;
    font-weight: 700;
    text-decoration: none;
}

/* BRAND */

.brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.shield {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#15c5b6,#007c86);
    color: white;
    font-size: 22px;
    border-radius: 11px;
}

.brand h3 {
    color: #122c4d;
    font-size: 15px;
}

.brand p {
    color: #627b97;
    font-size: 10px;
    margin-top: 3px;
}

@media(max-width:550px) {
    .register-container {
        padding: 25px 18px;
    }

    h1 {
        font-size: 28px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .input-group.full {
        grid-column: auto;
    }

    .role {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div class="background">
    <div class="dots"></div>
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="wave one"></div>
    <div class="wave two"></div>
</div>

<div class="register-container">

    <div class="security">
        <span>● Secure Registration</span>
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join CareerEquity AI and build a fairer workplace.
    </p>

    <!-- ROLE SELECTION -->

    <div class="roles">

        <button type="button"
                class="role active"
                onclick="selectRole(this,'HR Manager/Admin')">
            👥 HR Manager/Admin
        </button>

        <button type="button"
                class="role"
                onclick="selectRole(this,'Employee')">
            👤 Employee
        </button>

    </div>

    <form method="POST" action="{% url 'register_page' %}">

        {% csrf_token %}

        <input type="hidden"
               name="role"
               id="selectedRole"
               value="HR Manager/Admin">

        <div class="form-grid">

            <!-- FULL NAME -->

            <div class="input-group full">

                <label>Full Name</label>

                <div class="input-box">
                    <span class="input-icon">👤</span>
                    <input type="text"
                           name="full_name"
                           placeholder="Enter your full name"
                           required>
                </div>

            </div>

            <!-- EMAIL -->

            <div class="input-group" id="emailGroup">

                <label>Work Email</label>

                <div class="input-box">
                    <span class="input-icon">✉</span>
                    <input type="email"
                           name="email"
                           id="email"
                           placeholder="Enter work email"
                           required>
                </div>

            </div>

            <!-- EMPLOYEE ID -->

            <div class="input-group" id="employeeGroup" style="display:none">

                <label>Employee ID</label>

                <div class="input-box">
                    <span class="input-icon">🆔</span>
                    <input type="text"
                           name="employee_id"
                           id="employeeId"
                           placeholder="Enter Employee ID"
                           disabled>
                </div>

            </div>

            <!-- ORGANIZATION -->

            <div class="input-group" id="organizationGroup">

                <label>Organization Name</label>

                <div class="input-box">
                    <span class="input-icon">🏢</span>
                    <input type="text"
                           name="organization"
                           id="organization"
                           placeholder="Company name"
                           required>
                </div>

            </div>

            <!-- DEPARTMENT -->

            <div class="input-group" id="departmentGroup" style="display:none">

                <label>Department</label>

                <div class="input-box">
                    <span class="input-icon">🏬</span>
                    <input type="text"
                           name="department"
                           id="department"
                           placeholder="Your department"
                           disabled>
                </div>

            </div>

            <!-- DESIGNATION -->

            <div class="input-group full">

                <label>Designation</label>

                <div class="input-box">
                    <span class="input-icon">💼</span>
                    <input type="text"
                           name="designation"
                           placeholder="Enter your designation"
                           required>
                </div>

            </div>

            <!-- ADMIN INVITATION CODE -->

            <div class="input-group full" id="inviteGroup">

                <label>HR/Admin Invitation Code</label>

                <div class="input-box">
                    <span class="input-icon">🔑</span>
                    <input type="text"
                           name="invitation_code"
                           id="invitationCode"
                           placeholder="Enter authorized invitation code"
                           required>
                </div>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password"
                           name="password"
                           id="password"
                           placeholder="Create password"
                           minlength="8"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('password')">
                        👁
                    </button>
                </div>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>Confirm Password</label>

                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password"
                           name="confirm_password"
                           id="confirmPassword"
                           placeholder="Confirm password"
                           minlength="8"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword')">
                        👁
                    </button>
                </div>

            </div>

        </div>

        <button type="submit" class="register-btn">
            Create Account →
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login_page' %}">Sign In</a>
    </div>

    <div class="brand">

        <div class="shield">✓</div>

        <div>
            <h3>CareerEquity AI</h3>
            <p>Build a fairer, more inclusive workplace.</p>
        </div>

    </div>

</div>

<script>

/* ROLE SELECTION */

function selectRole(button, role) {

    document.querySelectorAll('.role').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');

    document.getElementById('selectedRole').value = role;

    const employee = role === 'Employee';

    const emailGroup = document.getElementById('emailGroup');
    const employeeGroup = document.getElementById('employeeGroup');

    const organizationGroup = document.getElementById('organizationGroup');
    const departmentGroup = document.getElementById('departmentGroup');

    const inviteGroup = document.getElementById('inviteGroup');

    const email = document.getElementById('email');
    const employeeId = document.getElementById('employeeId');

    const organization = document.getElementById('organization');
    const department = document.getElementById('department');

    const invitationCode = document.getElementById('invitationCode');

    if (employee) {

        emailGroup.style.display = 'none';
        employeeGroup.style.display = 'block';

        organizationGroup.style.display = 'none';
        departmentGroup.style.display = 'block';

        inviteGroup.style.display = 'none';

        email.required = false;
        email.disabled = true;

        employeeId.required = true;
        employeeId.disabled = false;

        organization.required = false;
        organization.disabled = true;

        department.required = true;
        department.disabled = false;

        invitationCode.required = false;
        invitationCode.disabled = true;

    } else {

        emailGroup.style.display = 'block';
        employeeGroup.style.display = 'none';

        organizationGroup.style.display = 'block';
        departmentGroup.style.display = 'none';

        inviteGroup.style.display = 'block';

        email.required = true;
        email.disabled = false;

        employeeId.required = false;
        employeeId.disabled = true;

        organization.required = true;
        organization.disabled = false;

        department.required = false;
        department.disabled = true;

        invitationCode.required = true;
        invitationCode.disabled = false;

    }

}

// PASSWORD VISIBILITY
function togglePassword(id) {
    const field = document.getElementById(id);

    field.type = field.type === 'password'
        ? 'text'
        : 'password';
}

// PASSWORD VALIDATION
document.querySelector('form').addEventListener('submit', function(e) {

    const password = document.getElementById('password').value;
    const confirmPassword =
        document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
    }

});

</script>


</body>
</html>
